<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunam's Cinematic Website</title>
  <style>
    /* Global Theme */
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #f0f0f0;
    }

    /* Navigation Bar */
    nav {
      background: rgba(0,0,0,0.8);
      padding: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
      position: sticky;
      top: 0;
    }
    nav a {
      color: #00ffff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #ff00ff;
    }

    /* Hero Section */
    .hero {
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: url('banner.jpg') center/cover no-repeat;
      color: #fff;
      text-shadow: 0 0 10px #000;
    }
    .hero h1 {
      font-size: 3em;
      margin: 0;
    }
    .hero p {
      font-size: 1.2em;
      margin-top: 10px;
    }

    /* Footer */
    footer {
      background: rgba(0,0,0,0.9);
      padding: 20px;
      text-align: center;
      font-size: 0.9em;
      color: #aaa;
    }
    footer input {
      padding: 8px;
      border: none;
      border-radius: 4px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav>
    <a href="#friends">Friends Zone</a>
    <a href="#trips">Trips</a>
    <a href="#photos">Photos</a>
    <a href="#videos">Videos</a>
    <a href="#adventures">Adventures</a>
    <a href="#vlog">Daily Vlog</a>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Welcome to My World</h1>
    <p>Cinematic vibes, colorful journeys, and daily adventures</p>
  </section>

  <!-- Footer -->
  <footer>
    <p>Have a query? Ask here:</p>
    <input type="text" placeholder="Type your question...">
  </footer>
</body>
</html>
