<!DOCTYPE html>

  <meta charset="UTF-8">

  <title>Sunam Dhayal - Welcome to My Life</title>
  <style>
    /* Global Theme */
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #f0f0f0;
    }

    /* Navigation Bar */
    nav {
      background: rgba(0,0,0,0.8);
      padding: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
      position: sticky;
      top: 0;
    }
    nav a {
      color: #00ffff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #ff00ff;
    }

    /* Hero Section */
    .hero {
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center; /* vertical center */
      align-items: center;     /* horizontal center */
      text-align: center;
      background: url('banner.jpg') center/cover no-repeat;
      color: #fff;
      text-shadow: 0 0 10px #000;
    }
    .hero h1 {
      font-size: 3.5em;
      margin: 0;
      animation: glow 2s ease-in-out infinite alternate;
    }
    .hero p {
      font-size: 1.5em;
      margin-top: 10px;
      color: #00ffff;
    }

    /* Glowing Effect */
    @keyframes glow {
      from {
        text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
      }
      to {
        text-shadow: 0 0 20px #ff00ff, 0 0 30px #ff00ff, 0 0 40px #ff00ff;
      }
    }

    /* Footer */
    footer {
      background: rgba(0,0,0,0.9);
      padding: 20px;
      text-align: center;
      font-size: 0.9em;
      color: #aaa;
    }
    footer input {
      padding: 8px;
      border: none;
      border-radius: 4px;
      margin-top: 10px;
    }
  </style>
</head>
